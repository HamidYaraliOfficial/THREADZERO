[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "threadzero"
version = "1.0.0"
description = "THREADZERO — Trust-Boundary Compiler: security as compilable architecture (Haskell core, Python orchestration, WASM runtime)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["wasmtime>=25.0.0", "fastapi>=0.110", "uvicorn[standard]>=0.29", "cryptography>=42.0", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
threadzero = "threadzero.cli:main"

[tool.setuptools.packages.find]
where = ["python"]
include = ["threadzero*"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["python"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::pytest.PytestUnraisableExceptionWarning"]
